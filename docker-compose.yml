# Optional convenience for reviewers: a local PostgreSQL matching backend/.env.example.
# These are throwaway development credentials, not for production.
# Usage: docker compose up -d  →  Postgres on 127.0.0.1:5432
services:
  postgres:
    image: postgres:16-alpine
    container_name: conduit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conduit_development
    ports:
      - "5432:5432"
    volumes:
      - conduit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  conduit-pgdata:
